<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem Vindo!</title>
    
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">

    
    
</head>
<body>
    <main class="container">
        <h1>Cadastro de Produtos</h1>
        <form action="#" method="post" id="cadastroProduto">
            
            <div class="row">
                
                <div class="form-field col-6">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" name="nome" id="nome" class="form-control" required>
                </div>
                
                <div class="form-field col-6">
                    <label for="valor" class="form-label">Valor</label>
                    <input type="number" class="form-control" name="valor" id="valor" placeholder="0.00" required>
                </div>
            </div>
            <br> 
            <div class="row">
                <div class="btn-group botoes col-12">
                    <button type="submit" class="btn-solid theme-primary" id="botaoSubmit">Adicionar</button>
                    
                </div>
            </div>
        </form>
        <br>
        
        
        <table class="table">
            <tbody id="conteudoTabela">
                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Nome</th>
                        <th scope="col">Valor</th>
                        <th scope="col">Editar</th>
                    </tr>
                </thead>
                <tbody id="conteudo-tabela">
                    
                </tbody>
                <tfoot>
                    <tr>
                        <td></td>
                        <td></td>
                        <td>Valor total: </td>
                    </tr>
                </tfoot>
            </table>
            <br>
        </main>
        <script>
            let estoque = []    
            let nomeImput = document.querySelector ('#nome')
            let valorImput = document.querySelector ('#valor')
            
            let form = document.querySelector('#cadastroProduto')
            form.addEventListener('submit',function(event){
                
                event.preventDefault();
                capturaFormulario()
            })
            
            let botaoSubmit = document.querySelector('#botaoSubmit')
            botaoSubmit.addEventListener("mouseover",function(){
                console.log('oi')
            })
            
            function capturaFormulario() {
                
                let produto = {
                    nome: nome.value,
                    valor: valor.value
                }
                
                estoque.push(produto)
                console.log(estoque)
                
                atualizarTabela(estoque)
            }
            
            function atualizarTabela(estoque){
                let tbody = document.querySelector('#conteudoTabela')
                let linhasDaTabela = document.querySelectorAll('#conteudoTabela tr')
                linhasDaTabela.forEach(linha => linha.remove())


                for (let index = 0; index < estoque.length; index++) {
                    let produto = estoque[index]
                    produto.id = index 
                    
                    let tr = document.createElement('tr')
                    tr.setAttribute('id', 'produto-' + produto.id)
                    let tdId = document.createElement('td')
                    tdId.textContent = index
                    let tdNome = document.createElement('td')
                    let tdValor = document.createElement('td')
                    let iRemover = document.createElement('i')
                    let iEditar = document.createElement('i')
                    iRemover.setAttribute('class', 'bi bi-trash3 remover')
                    iEditar.setAttribute('class', 'bi bi-pencil editar')
                    
                    iRemover.addEventListener('click',() => remover(produto.id))
                    iEditar.addEventListener('click',() => carregar(produto))

                    
                    iRemover.addEventListener('mouseover',() => {
                        iRemover.classList.replace('bi-trash3', 'bi-trash3-fill' )
                    })
                    iRemover.addEventListener('mouseleave',() => {
                        iRemover.classList.replace('bi-trash3-fill' , 'bi-trash3')

                    })


                    
                    iEditar.addEventListener('mouseover',() => {
                    iEditar.classList.replace('bi-pencil', 'bi-pencil-fill' )
                    })
                    iEditar.addEventListener('mouseleave',() => {
                        iEditar.classList.replace('bi-pencil-fill' , 'bi-pencil')

                    })


                    //aRemover.setAttribute('href',`javascript:remover(${produto.id})`)
                    
                    let tdEditar = document.createElement('td')
                    
                    tdNome.textContent = produto.nome
                    tdValor.textContent = produto.valor
                    tdEditar.append(iEditar)
                    tdEditar.append(' ')
                    tdEditar.append(iRemover)
                    
                    tr.append(tdId)
                    tr.append(tdNome)
                    tr.append(tdValor)
                    tr.append(tdEditar)
                    
                    tbody.append(tr)
                }  
            }
            
            function remover(id){
                console.log('remover produto', id)
                estoque.splice(id,1)
                atualizarTabela(estoque)
            }
            function carregar(produto) {
                nomeImput.value = produto.nome
                valorImput.value = produto.valor

            }
            
            

            
        </script>
    </body>
    </html>
